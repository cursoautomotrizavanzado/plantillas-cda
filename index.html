<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c8441c">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Plantillas CDA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Layout: lista de tarjetas a una columna, barra de búsqueda fija arriba, acción flotante abajo. Pensado para pulgar. */
:root{
  --bg:#f3f4f1; --card:#ffffff; --fg:#161a1d; --muted:#5f6b6a; --line:#d9ddd6;
  --accent:#c8441c; --accent-fg:#ffffff; --wa:#1f8f4e; --chip:#e7eae3; --chip-on:#161a1d; --chip-on-fg:#ffffff;
  --display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Source Sans 3","Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141716; --card:#1e2221; --fg:#eef0ec; --muted:#9aa5a1; --line:#2f3533;
  --accent:#e8603a; --accent-fg:#141716; --wa:#34c46f; --chip:#262b29; --chip-on:#eef0ec; --chip-on-fg:#141716; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#141716; --card:#1e2221; --fg:#eef0ec; --muted:#9aa5a1; --line:#2f3533;
  --accent:#e8603a; --accent-fg:#141716; --wa:#34c46f; --chip:#262b29; --chip-on:#eef0ec; --chip-on-fg:#141716; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding-block:12px 8px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:700;font-size:28px;margin:0;letter-spacing:.01em;text-wrap:balance}
h1 span{color:var(--accent)}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;font:inherit;font-size:17px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg)}
.icon-btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:0 14px;cursor:pointer;font-size:15px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-size:14px;font-weight:600;padding:7px 13px;border-radius:999px;border:0;background:var(--chip);color:var(--fg);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-fg)}

.list{display:flex;flex-direction:column;gap:10px;padding-top:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.pinned{border-color:var(--accent)}
.card-head{display:flex;align-items:flex-start;gap:8px}
.card-title{font-family:var(--display);font-weight:600;font-size:19px;line-height:1.15;flex:1;min-width:0;margin:0}
.badge{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:3px 8px;border:1px solid var(--line);border-radius:6px;white-space:nowrap}
.preview{margin:0;color:var(--muted);font-size:15px;white-space:pre-wrap;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;word-break:break-word}
.card.open .preview{display:block;color:var(--fg)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;font-size:15px;border:0;border-radius:9px;padding:10px 14px;cursor:pointer;background:var(--chip);color:var(--fg);flex:1;min-width:0;text-align:center;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.wa{background:var(--wa);color:#fff}
.btn.small{flex:none;padding:10px 12px;font-size:14px}
.btn:focus-visible,.chip:focus-visible,.icon-btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--muted);padding:40px 16px;font-size:15px}

.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-size:34px;line-height:1;border:0;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer;z-index:6}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--chip-on);color:var(--chip-on-fg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:15px;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);color:var(--fg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet h2{font-family:var(--display);font-size:22px;margin:0}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
label input,label textarea,label select{font:inherit;font-family:var(--body);font-size:16px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:11px 12px;width:100%}
label textarea{min-height:150px;resize:vertical;line-height:1.45}
.hint{font-size:13px;color:var(--muted);margin:0}
.row{display:flex;gap:8px}
.danger{color:var(--accent)}
.settings-list{display:flex;flex-direction:column;gap:10px}
.settings-list textarea{min-height:110px}
[hidden]{display:none!important}
.lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px max(24px,env(safe-area-inset-left,0px))}
.lock h2{font-family:var(--display);font-weight:700;font-size:34px;margin:0}
.lock h2 span{color:var(--accent)}
.lock-msg{margin:0;color:var(--muted);font-size:16px;text-align:center;min-height:22px}
.lock input{width:min(260px,100%);font:inherit;font-size:30px;letter-spacing:.5em;text-align:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg)}
.lock .btn{flex:none;width:min(260px,100%)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style></head><body>

<div class="wrap">
  <header>
    <div class="brand">
      <h1>Plantillas <span>CDA</span></h1>
      <span class="count" id="count"></span>
    </div>
    <div class="search">
      <input id="q" type="search" placeholder="Buscar plantilla…" autocomplete="off">
      <button class="icon-btn" id="settingsBtn" aria-label="Ajustes">⋯</button>
    </div>
    <div class="chips" id="chips"></div>
  </header>
  <main class="list" id="list"></main>
</div>
<button class="fab" id="addBtn" aria-label="Nueva plantilla">+</button>
<div class="toast" id="toast" role="status"></div>
<div id="modal"></div>
<div class="lock" id="lock" hidden></div>

<script>
const KEY='cda_plantillas_v1';
const SEED=[
 {t:'Respuesta inicial a consulta',c:'Consultas',x:'Hola {nombre} 👋 Gracias por escribir a CDA Diagnóstico Automotriz.\n\nCuéntame qué necesitas: ¿información de un curso, una app o ayuda con un caso de diagnóstico? Así te respondo directo.'},
 {t:'Precio y contenido del Curso Master',c:'Cursos',x:'El Curso Master de Sensores y Actuadores Automotrices cubre desde la señal eléctrica hasta el diagnóstico con osciloscopio, con casos reales.\n\n📌 Acceso de por vida y actualizaciones.\n💵 Inversión: {precio}\n\n¿Te paso los datos de pago?'},
 {t:'Datos de pago',c:'Pagos',x:'Perfecto {nombre}. Puedes pagar aquí:\n{enlace}\n\nCuando completes el pago envíame el comprobante por este chat y te activo el acceso de inmediato.'},
 {t:'Pago confirmado / acceso activado',c:'Pagos',x:'¡Pago recibido, {nombre}! ✅\n\nTu acceso ya está activo. Entra con este enlace:\n{enlace}\n\nCualquier duda con el contenido me escribes por aquí. ¡Bienvenido!'},
 {t:'Seguimiento a quien no respondió',c:'Seguimiento',x:'Hola {nombre}, te escribo para saber si sigues interesado en el curso. Si tienes alguna duda sobre el contenido o la forma de pago, con gusto te ayudo 🔧'},
 {t:'Pedir datos de un caso de diagnóstico',c:'Diagnóstico',x:'Para ayudarte con el caso necesito:\n\n1. Marca, modelo, año y motor\n2. Códigos DTC presentes\n3. Síntoma exacto y cuándo ocurre (frío, caliente, ralentí, carga)\n4. Qué ya revisaste o reemplazaste\n\nSi tienes capturas del escáner u osciloscopio, envíalas.'},
 {t:'Horario de atención',c:'Consultas',x:'Atiendo mensajes de lunes a sábado. Si escribes fuera de ese horario te respondo apenas me conecte. Gracias por la paciencia 🙌'}
];
let state=load();
let cat='Todas', query='';

function load(){
  try{const r=localStorage.getItem(KEY); if(r){const d=JSON.parse(r); if(Array.isArray(d.items)) return d;}}catch(e){}
  return {items:SEED.map(seedItem)};
}
function seedItem(s,i){return {id:'s'+i,title:s.t,cat:s.c,text:s.x,uses:0,pinned:false,created:Date.now()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function uid(){return Math.random().toString(36).slice(2,10)}
function cats(){const s=new Set(state.items.map(i=>i.cat).filter(Boolean));return ['Todas',...[...s].sort()]}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function vars(text){return [...new Set((text.match(/\{([^{}]+)\}/g)||[]).map(v=>v.slice(1,-1)))]}

function render(){
  const chips=document.getElementById('chips');
  chips.innerHTML=cats().map(c=>`<button class="chip" aria-pressed="${c===cat}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');
  const q=query.trim().toLowerCase();
  let items=state.items.filter(i=>(cat==='Todas'||i.cat===cat)&&(!q||(i.title+' '+i.text+' '+i.cat).toLowerCase().includes(q)));
  items.sort((a,b)=>(b.pinned-a.pinned)||(b.uses-a.uses)||(b.created-a.created));
  document.getElementById('count').textContent=items.length+' de '+state.items.length;
  const list=document.getElementById('list');
  if(!items.length){list.innerHTML=`<div class="empty">No hay plantillas aquí todavía.<br>Toca <b>+</b> para crear una.</div>`;return;}
  list.innerHTML=items.map(i=>`<article class="card${i.pinned?' pinned':''}" data-id="${i.id}">
    <div class="card-head"><h2 class="card-title">${i.pinned?'📌 ':''}${esc(i.title)}</h2><span class="badge">${esc(i.cat||'—')}</span></div>
    <p class="preview" data-act="toggle">${esc(i.text)}</p>
    <div class="actions">
      <button class="btn primary" data-act="copy">Copiar</button>
      <button class="btn wa" data-act="wa">WhatsApp</button>
      <button class="btn small" data-act="edit">Editar</button>
    </div>
    <div class="meta">${i.uses?`Usada ${i.uses} ${i.uses===1?'vez':'veces'}`:'Sin usar aún'}${vars(i.text).length?' · campos: '+vars(i.text).map(v=>'{'+esc(v)+'}').join(' '):''}</div>
  </article>`).join('');
}

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1600)}

async function copyText(txt){
  try{await navigator.clipboard.writeText(txt);return true}catch(e){
    const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
    let ok=false;try{ok=document.execCommand('copy')}catch(_){}document.body.removeChild(ta);return ok;}
}

function resolve(item,then){
  const vs=vars(item.text);
  if(!vs.length) return then(item.text);
  openSheet(`<h2>Completa los campos</h2>
    ${vs.map((v,n)=>`<label>${esc(v)}<input id="v${n}" data-var="${esc(v)}" autocomplete="off"></label>`).join('')}
    <div class="row"><button class="btn" data-act="close">Cancelar</button><button class="btn primary" id="fillOk">Continuar</button></div>`);
  const first=document.querySelector('#modal input');if(first)first.focus();
  document.getElementById('fillOk').onclick=()=>{
    let out=item.text;
    document.querySelectorAll('#modal input[data-var]').forEach(inp=>{const v=inp.dataset.var;out=out.split('{'+v+'}').join(inp.value||'{'+v+'}')});
    closeSheet();then(out);
  };
}
function bump(item){item.uses=(item.uses||0)+1;save();render()}

function openSheet(html){const m=document.getElementById('modal');m.innerHTML=`<div class="sheet-bg" id="sheetBg"><div class="sheet">${html}</div></div>`;
  document.getElementById('sheetBg').addEventListener('click',e=>{if(e.target.id==='sheetBg')closeSheet()});}
function closeSheet(){document.getElementById('modal').innerHTML=''}

function editSheet(item){
  const isNew=!item;
  const it=item||{id:uid(),title:'',cat:'',text:'',uses:0,pinned:false,created:Date.now()};
  const opts=cats().filter(c=>c!=='Todas');
  openSheet(`<h2>${isNew?'Nueva plantilla':'Editar plantilla'}</h2>
    <label>Título<input id="fTitle" value="${esc(it.title)}" placeholder="Ej. Precio del curso diésel"></label>
    <label>Categoría<input id="fCat" list="catList" value="${esc(it.cat)}" placeholder="Cursos, Pagos, Diagnóstico…"><datalist id="catList">${opts.map(o=>`<option value="${esc(o)}">`).join('')}</datalist></label>
    <label>Mensaje<textarea id="fText" placeholder="Escribe el mensaje. Usa {nombre}, {precio}, {enlace} para campos que cambian.">${esc(it.text)}</textarea></label>
    <p class="hint">Todo lo que pongas entre llaves, como {nombre}, se te pedirá al momento de copiar o enviar.</p>
    <div class="row"><button class="btn" data-act="close">Cancelar</button><button class="btn primary" id="saveBtn">Guardar</button></div>
    ${isNew?'':`<div class="row"><button class="btn" id="pinBtn">${it.pinned?'Quitar de fijados':'Fijar arriba'}</button><button class="btn danger" id="delBtn">Eliminar</button></div>`}`);
  document.getElementById('saveBtn').onclick=()=>{
    const title=document.getElementById('fTitle').value.trim(),text=document.getElementById('fText').value.trim(),c=document.getElementById('fCat').value.trim();
    if(!title||!text){toast('Falta el título o el mensaje');return}
    it.title=title;it.text=text;it.cat=c||'General';
    if(isNew)state.items.unshift(it);
    save();render();closeSheet();toast('Guardada');
  };
  if(!isNew){
    document.getElementById('pinBtn').onclick=()=>{it.pinned=!it.pinned;save();render();closeSheet()};
    document.getElementById('delBtn').onclick=function(){
      if(this.dataset.armed){state.items=state.items.filter(x=>x.id!==it.id);save();render();closeSheet();toast('Eliminada');return}
      this.dataset.armed='1';this.textContent='¿Seguro? Toca otra vez';
    };
  }
}

function settingsSheet(){
  openSheet(`<h2>Respaldo</h2>
    <div class="settings-list">
      <p class="hint">Tus plantillas viven en este teléfono. Para pasarlas a otro equipo o guardarlas, copia este texto y pégalo allá con "Importar".</p>
      <label>Exportar<textarea id="expArea" readonly>${esc(JSON.stringify(state.items))}</textarea></label>
      <button class="btn" id="expCopy">Copiar respaldo</button>
      <label>Importar (pega el texto del respaldo)<textarea id="impArea"></textarea></label>
      <div class="row"><button class="btn" id="impMerge">Agregar a las actuales</button><button class="btn" id="impReplace">Reemplazar todo</button></div>
      <div class="row"><button class="btn" id="lockNow">Bloquear ahora</button><button class="btn" id="changePin">Cambiar PIN</button></div>
      <button class="btn" data-act="close">Cerrar</button>
    </div>`);
  document.getElementById('lockNow').onclick=()=>{closeSheet();showLock()};
  document.getElementById('changePin').onclick=()=>{closeSheet();showLock(true)};
  document.getElementById('expCopy').onclick=async()=>{toast((await copyText(JSON.stringify(state.items)))?'Respaldo copiado':'No se pudo copiar; selecciona el texto')};
  const doImport=replace=>{
    let d;try{d=JSON.parse(document.getElementById('impArea').value)}catch(e){toast('El texto no es un respaldo válido');return}
    if(!Array.isArray(d)){toast('El texto no es un respaldo válido');return}
    const clean=d.filter(x=>x&&x.title&&x.text).map(x=>({id:x.id||uid(),title:String(x.title),cat:String(x.cat||'General'),text:String(x.text),uses:+x.uses||0,pinned:!!x.pinned,created:+x.created||Date.now()}));
    if(replace)state.items=clean;else{const ids=new Set(state.items.map(x=>x.id));state.items=[...state.items,...clean.filter(x=>!ids.has(x.id))]}
    save();render();closeSheet();toast(clean.length+' plantillas importadas');
  };
  document.getElementById('impMerge').onclick=()=>doImport(false);
  document.getElementById('impReplace').onclick=()=>doImport(true);
}

document.getElementById('q').addEventListener('input',e=>{query=e.target.value;render()});
document.getElementById('chips').addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(b){cat=b.dataset.cat;render()}});
document.getElementById('addBtn').onclick=()=>editSheet(null);
document.getElementById('settingsBtn').onclick=settingsSheet;
document.getElementById('modal').addEventListener('click',e=>{if(e.target.closest('[data-act="close"]'))closeSheet()});
document.getElementById('list').addEventListener('click',e=>{
  const card=e.target.closest('.card');if(!card)return;
  const item=state.items.find(i=>i.id===card.dataset.id);if(!item)return;
  const act=(e.target.closest('[data-act]')||{}).dataset?.act;
  if(act==='toggle')card.classList.toggle('open');
  else if(act==='edit')editSheet(item);
  else if(act==='copy')resolve(item,async txt=>{const ok=await copyText(txt);bump(item);toast(ok?'Copiado ✓':'Mantén presionado el texto para copiarlo')});
  else if(act==='wa')resolve(item,txt=>{bump(item);window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank')||(location.href='https://wa.me/?text='+encodeURIComponent(txt))});
});

/* ---- Bloqueo con PIN (4 a 6 números). Se crea en el primer uso y se guarda cifrado en este teléfono ---- */
const PINKEY='cda_pin_v1';
let fails=0,blockedUntil=0;
function readPin(){try{return JSON.parse(localStorage.getItem(PINKEY))}catch(e){return null}}
async function hashPin(pin,salt){
  const s=salt+':'+pin;
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=5381;for(const ch of s)h=((h<<5)+h+ch.charCodeAt(0))>>>0;return 'x'+h}
}
function showLock(forceSetup){
  const el=document.getElementById('lock');
  const rec=forceSetup?null:readPin();
  const setup=!rec;
  let first='',forgotArmed=false;
  el.hidden=false;
  const draw=(msg)=>{
    el.innerHTML=`<h2>Plantillas <span>CDA</span></h2>
      <p class="lock-msg" id="lockMsg">${msg}</p>
      <input id="pinIn" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" aria-label="PIN">
      <button class="btn primary" id="pinOk">${setup?(first?'Confirmar PIN':'Continuar'):'Entrar'}</button>
      ${setup?'':'<button class="btn" id="pinForgot">Olvidé mi PIN</button>'}`;
    const inp=document.getElementById('pinIn');inp.focus();
    inp.addEventListener('keydown',e=>{if(e.key==='Enter')submit()});
    document.getElementById('pinOk').onclick=submit;
    const f=document.getElementById('pinForgot');
    if(f)f.onclick=()=>{
      if(!forgotArmed){forgotArmed=true;document.getElementById('lockMsg').textContent='Esto borra tus plantillas y el PIN. Toca de nuevo para confirmar.';f.textContent='Sí, borrar todo';return}
      try{localStorage.removeItem(PINKEY);localStorage.removeItem(KEY)}catch(e){}
      state={items:SEED.map(seedItem)};cat='Todas';query='';render();
      showLock();
    };
  };
  const msg=t=>{document.getElementById('lockMsg').textContent=t;const i=document.getElementById('pinIn');i.value='';i.focus()};
  const submit=async()=>{
    const v=document.getElementById('pinIn').value.trim();
    if(!/^\d{4,6}$/.test(v)){msg('El PIN debe tener de 4 a 6 números');return}
    if(setup){
      if(!first){first=v;draw('Repite el PIN para confirmar');return}
      if(v!==first){first='';draw('No coinciden. Crea el PIN otra vez');return}
      const salt=uid();const hash=await hashPin(v,salt);
      try{localStorage.setItem(PINKEY,JSON.stringify({salt,hash}))}catch(e){}
      el.hidden=true;el.innerHTML='';toast('PIN guardado');return;
    }
    if(Date.now()<blockedUntil){msg('Espera unos segundos e intenta de nuevo');return}
    if(await hashPin(v,rec.salt)===rec.hash){fails=0;el.hidden=true;el.innerHTML='';return}
    fails++;
    if(fails>=5){blockedUntil=Date.now()+30000;fails=0;msg('Demasiados intentos. Espera 30 segundos')}
    else msg('PIN incorrecto');
  };
  draw(setup?'Crea un PIN de 4 a 6 números':'Ingresa tu PIN');
}
render();
showLock();
</script>
